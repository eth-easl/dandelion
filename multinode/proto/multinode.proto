syntax = "proto3";
package multinode_proto;

// Node Information, sent to register new client on server
message NodeInfo {
    uint32 version = 1;
    uint64 id = 2;
    uint64 num_local_cores = 3;
}

enum SystemFunction {
    HTTP = 0;
    MEMCACHED = 1;
}

message ItemData {
    oneof data {
        RemoteData remote_data = 1;
        IoData io_data = 2;
        IoData coordinated_io_data = 3;
    }
}

message IoData {
    SystemFunction function = 1;
    uint64 set_index = 2;
    ItemData data = 3;
    // Stable identity and ownership metadata for lazy I/O coordination and recovery.
    string invocation_id = 4;
    uint64 composition_set_id = 5;
    string item_identifier = 6;
    uint64 item_key = 7;
    uint64 original_size = 8;
    uint64 owner_node_id = 9;
}

message RemoteData {
    uint64 node_id = 1;
    uint64 data_id = 2;
    uint64 size = 3;
}

message MetadataItem {
    string ident = 1;
    uint32 key = 2;
    ItemData data = 3; 
}

message MetadataSet {
    string ident = 1;
    repeated MetadataItem items = 2;
}

message Invocation {
    uint32 remote_invocation_id = 1;
    string function_id = 2;
    repeated MetadataSet metadata_sets = 3;
    bool caching = 4;
    string owner_invocation_id = 5;
}

message RepeatedInvocations {
    repeated Invocation invocations = 1;
}

enum EngineType {
    ENGINE_REQWEST = 0;
    ENGINE_CHERI = 1;
    ENGINE_PROCESS = 2;
    ENGINE_KVM = 3;
}

message Engine {
    EngineType engine_type = 1;
    uint32 engine_capacity = 2;
}

message RepeatedEngines {
    repeated Engine engines = 1;
}

message Timestamps { 
    uint64 start_epoch = 1;
    uint64 io_queue_start = 2;
    uint64 io_queue_end = 3;
    uint64 compute_queue_start = 4;
    uint64 compute_queue_end = 5;
    uint64 fetching_start = 6;
    uint64 fetching_end = 7;
    uint64 parsing_start = 8;
    uint64 parsing_end = 9;
    uint64 load_start = 10;
    uint64 transfer_start = 11;
    uint64 engine_start = 12;
    uint64 engine_end = 13;
    uint64 input_items = 14;
    uint64 input_size = 15;
}

message RepeatedMetadataSet {
    repeated MetadataSet metadata_sets = 1;
    Timestamps timestamps = 2;
}

message Response {
    uint32 remote_invocation_id = 1;
    oneof response {
        string error_msg = 2;
        RepeatedMetadataSet metadata_sets = 3;
    }
}

message NodeUpdate {
    uint64 num_local_cores = 1;
}

message IoCompletionDelivery {
    string journal_line = 1;
}

message IoCompletionAcknowledgement {
    string invocation_id = 1;
    uint64 composition_set_id = 2;
    string function = 3;
    string identifier = 4;
    uint64 item_key = 5;
    // False retains the submitted durable outputs; true deletes them as a duplicate or late result.
    bool delete_outputs = 6;
}

message IoCoordinationKey {
    string invocation_id = 1;
    uint64 composition_set_id = 2;
    SystemFunction function = 3;
    string identifier = 4;
    uint64 item_key = 5;
}

// Worker -> owner: elect a winner or wait for / reuse an existing result.
message IoResolveRequest {
    IoCoordinationKey key = 1;
    uint64 set_index = 2;
    uint64 requester_node_id = 3;
    RemoteData original_data = 4;
}

message IoResolveExecuteNone {}

message IoResolveRetry {}

// Owner -> worker: Execute, Completed, Failed, or Retry.
message IoResolveResponse {
    oneof response {
        IoResolveExecuteNone execute_none = 1;
        bytes execute_inline = 2;
        RemoteData execute_remote = 3;
        RemoteData completed = 4;
        string failed = 5;
        IoResolveRetry retry = 6;
    }
}

message IoResolvedOutputs {
    repeated RemoteData outputs = 1;
}

// Winner -> owner: publish the I/O outcome.
message IoResolvedRequest {
    IoCoordinationKey key = 1;
    oneof outcome {
        IoResolvedOutputs completed = 2;
        string failed = 3;
    }
}

// Message from remote node to get work or return completed tasks
message RemoteMessage {
    oneof remote_message {
        // Message to ask for more work, containing currently vailable resources
        RepeatedEngines work_request = 1;
        // Message containing the response for a specific function that was run 
        Response response = 2;
        // Update message to the server
        NodeUpdate node_update = 3;
        // Durable async IO completion awaiting owner acknowledgement
        IoCompletionDelivery io_completion = 4;
    }
}

// Messages to the remote node that asked for work
// Either responding with 
message QueueMessage {
   oneof queue_message {
        // Message to indicate that there currently is no work, if true, if false, signify that there would be work to ask for
        bool no_work = 1;
        // Message containing the work for one function
        RepeatedInvocations invocations = 2;
        // Message containing the work for one function, can be refused
        Invocation try_offload = 3;
        // Message indicating a previously sent remote invocation should not be scheduled if possible
        uint32 cancel_invocation = 4;
        // Owner has durably recorded an async IO completion
        IoCompletionAcknowledgement io_completion_ack = 5;
   }
}
